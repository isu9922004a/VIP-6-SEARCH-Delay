name: V9.28 five strategy archive replay evidence
on:
  push:
    branches: ['feat/v928-telegram-bot']
    paths: ['.github/workflows/v928-strategy-replay.yml']
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CHROME_BIN: /usr/bin/google-chrome
      V95_STRATEGIES: momentum,daytrade,strong,tower,restaurant
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Replay unchanged production scanner using archived market inputs (evidence only)
        run: |
          mkdir -p "$RUNNER_TEMP/v928-strategy"
          git rev-parse HEAD > "$RUNNER_TEMP/v928-strategy/source-sha.txt"
          npm run test:selection:v95 -- "$RUNNER_TEMP/v928-strategy"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v928-strategy-replay-evidence-not-for-publication
          path: ${{ runner.temp }}/v928-strategy
