name: V8.6 genuine Kronos walk-forward
on:
  workflow_dispatch:
  push:
    branches: ['release/v8-6']
    paths:
      - '.github/workflows/v86-backtest.yml'
      - 'kronos/run.py'
      - 'research-v86/market-*.js'
      - 'scripts/backtest/**'
permissions:
  contents: write
concurrency:
  group: v86-backtest-${{ github.ref }}
  cancel-in-progress: false
jobs:
  genuine-walk-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-v83-small-pinned-${{ hashFiles('kronos/model-lock.json') }}
      - name: Install real CPU inference runtime
        run: |
          python -m pip install --disable-pip-version-check torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check -r kronos/requirements.txt
      - name: Run immutable prefix-only genuine inference
        run: python scripts/backtest/run-v86.py
      - name: Capture later observations separately
        run: node scripts/backtest/capture-outcome.cjs
      - name: Score fixed chronological holdout and crash sensitivities
        run: node scripts/backtest/score-v86.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v86-walk-forward-raw-and-comparison
          path: data/backtest/v86
      - name: Preserve reviewable raw receipts and measured results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/backtest/v86/results.json data/backtest/v86/comparison.json data/backtest/v86/observed-outcomes.json
          git commit -m 'Record genuine V8.6 walk-forward samples and held-out comparison'
          git pull --rebase origin '${{ github.ref_name }}'
          python - <<'PY'
          import sys,json
          sys.path.insert(0,'scripts/backtest')
          from importlib.util import spec_from_file_location,module_from_spec
          s=spec_from_file_location('wf','scripts/backtest/run-v86.py');m=module_from_spec(s);s.loader.exec_module(m)
          assert m.policy_hash()==json.load(open('data/backtest/v86/results.json'))['policySHA256'], 'Policy changed; do not publish stale evaluation'
          PY
          git push origin HEAD:'${{ github.ref_name }}'
