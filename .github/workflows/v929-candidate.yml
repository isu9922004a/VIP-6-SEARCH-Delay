name: V9.29 candidate low-base breakout verification
on:
  pull_request:
    paths:
      - 'strategy-low-base-*-v929.js'
      - 'scripts/tests/low-base-breakout-v929.test.cjs'
      - '.github/workflows/v929-candidate.yml'
      - 'index.html'
      - 'scripts/audit-v929-universe.cjs'
      - 'scripts/audit-v929-history-gaps.mjs'
      - 'scripts/audit-v929-historical-replay.mjs'
      - 'scripts/tests/v90-browser.cjs'
      - 'scripts/tests/report-beginner-copy.test.cjs'
permissions:
  contents: read
jobs:
  candidate-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check strategy-low-base-breakout-v929.js
      - run: node --check strategy-low-base-lifecycle-v929.js
      - run: node --check strategy-low-base-scanner-v929.js
      - run: node --check strategy-low-base-report-v929.js
      - run: node --check strategy-low-base-ui-v929.js
      - run: node --test scripts/tests/low-base-breakout-v929.test.cjs
  archive-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/audit-v929-universe.cjs /tmp/v929-universe
      - run: node scripts/audit-v929-history-gaps.mjs /tmp/v929-universe/results.json /tmp/v929-universe/history-gap-review.json
      - run: node scripts/audit-v929-historical-replay.mjs /tmp/v929-universe/historical-replay.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v929-official-archive-replay
          path: /tmp/v929-universe/*.json
          if-no-files-found: warn
