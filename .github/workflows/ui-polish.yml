name: UI polish visual contract
on:
  pull_request:
    paths: ['index.html', 'ui-polish-v1.css', 'scripts/audit-ui-polish.py', 'scripts/tests/ui-polish-browser.cjs', 'scripts/tests/ui-polish-controls-browser.cjs', '.github/workflows/ui-polish.yml']
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Preserve PR base and verify markup and JavaScript invariants
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p /tmp/shitou-ui-polish-before
          git show "$BASE_SHA:index.html" > /tmp/shitou-ui-polish-before/index.html
          python3 scripts/audit-ui-polish.py /tmp/shitou-ui-polish-before/index.html
      - run: npm ci
      - name: Install Traditional Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Replay both themes and compare PNG bytes against the PR base
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/tests/ui-polish-browser.cjs /tmp/ui-polish-evidence
      - name: Exercise recorded stock queries and all existing exports
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node scripts/tests/ui-polish-controls-browser.cjs /tmp/ui-polish-evidence/controls
          node scripts/tests/research-context-r16-browser.cjs /tmp/ui-polish-evidence/context
          node scripts/tests/v84-report-browser.cjs /tmp/ui-polish-evidence/exports
          node scripts/tests/elliott-browser.cjs /tmp/ui-polish-evidence/elliott
      - name: Run all unit and contract checks
        run: |
          npm test
          npm run test:contract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-polish-visual-evidence
          path: |
            /tmp/ui-polish-evidence
            docs/ui-polish
