name: V9.22 live Worker seven-source read-only acceptance
on:
  push:
    branches: ['probe/v922-tpex-source']
    paths:
      - 'scripts/probes/v922-worker-live-acceptance.mjs'
      - '.github/workflows/v922-worker-live-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect live Worker exchange receipts without changing deployment
        run: node scripts/probes/v922-worker-live-acceptance.mjs
