name: Deploy verified frontend release
on:
  push:
    branches: ['main']
    # Release verification must also run for V9.2 implementation changes,
    # not only for changes to the visible release label.
    paths:
      - 'version-v50.js'
      - 'index.html'
      - 'market-outlook.html'
      - 'kline-life-03-*.js'
      - 'research-life-source-audit-v932.js'
      - 'research-integration-v1.js'
      - 'research-report-v1.js'
      - 'research-chart-v1.js'
      - 'research-chart-layout-v921.js'
      - 'research-ui-v921.css'
      - 'stock-professional-v84.js'
      - 'scripts/tests/kline-life-03*'
      - 'scripts/tests/research-context-r16-browser.cjs'
      - 'scripts/tests/v84-live-smoke.cjs'
      # Only the successfully published and versioned real forecast catalog
      # should trigger post-recovery frontend/live verification.
      - 'data/kronos-future/manifest.json'
      - 'scripts/tests/kronos-future-live-browser.cjs'
      - 'scripts/tests/market-comfort-browser.cjs'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify model matching, plain reports and market regression
        run: |
          node --check mobile-image-share-v1.js
          node --check market-report-refresh-v864.js
          node --check market-report-comfort-v864.js
          node --check r45-report-suite.js
          node --check four-models-research-v1.js
          node --check research-v83/kronos-data.js
          node --check research-v83/market-simple-report.js
          node --check research-v83/stock-simple-report.js
          node --test scripts/tests/kronos-report-binding.test.cjs scripts/tests/research-plain-narrative.test.cjs scripts/tests/market-v86.test.cjs scripts/tests/index-update-v862.test.cjs scripts/tests/market-freshness-v862.test.cjs scripts/tests/market-simple-report.test.cjs scripts/tests/pages-runtime-data.test.cjs scripts/tests/structure-strength-v863.test.cjs scripts/tests/stock-simple-report.test.cjs scripts/tests/report-observations-v864.test.cjs scripts/tests/index-recovery.test.cjs scripts/tests/mobile-share-render-region.test.mjs scripts/tests/market-report-refresh.test.cjs
      - run: npm ci
      - name: Verify all research tests and data contracts
        run: |
          npm test
          npm run test:contract
          npm run research:validate
      - name: Install Chinese fonts for actual release images
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      # Browser release expectations are read from version-v50.js.
      - name: Verify current-release structure, mobile layout and complete PNG variants
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node scripts/tests/kronos-future-browser.cjs /tmp/v864-browser/future
          node scripts/tests/kronos-future-universe-browser.cjs /tmp/v864-browser/future-universe
          npm run test:browser -- /tmp/v864-browser/general
          node scripts/tests/research-context-r16-browser.cjs /tmp/v864-browser/context
          RESEARCH_FALLBACK=1 node scripts/tests/research-context-r16-browser.cjs /tmp/v864-browser/context-fallback
          npm run test:engulf-range-browser
          npm run test:elliott-browser -- /tmp/v864-browser/elliott
          node scripts/tests/wave-postclose-browser.cjs /tmp/v864-browser/postclose
          node scripts/tests/wave-postclose-universe-browser.cjs /tmp/v864-browser/postclose-universe
          node scripts/tests/strong-all-memory-browser.cjs /tmp/v864-browser/strong-memory
          node scripts/tests/market-date-browser.cjs /tmp/v864-browser/market-date
          node scripts/tests/structure-v863-browser.cjs /tmp/v864-browser
          node scripts/tests/market-v862-browser.cjs /tmp/v864-browser
          node scripts/tests/research-v921-browser.cjs /tmp/v864-browser/v921
          node scripts/tests/market-comfort-browser.cjs /tmp/v864-browser
      - name: Check structure observations across the published stock universe
        run: node scripts/audit-structure-strength.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v864-browser-evidence
          path: /tmp/v864-browser
  deploy:
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-data-pages.yml
    with:
      artifact-name: frontend-release-pages

  live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Install Chinese fonts for published image verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Check published bytes and run research UI on the deployed site
        env:
          CHROME_BIN: /usr/bin/google-chrome
          RESEARCH_BROWSER_ORIGIN: https://isu9922004a.github.io/VIP-6-SEARCH-Delay/
        run: |
          python3 scripts/verify-deployed-frontend.py
          node scripts/tests/research-v921-browser.cjs /tmp/v864-browser/v921-live
          node scripts/tests/kronos-future-live-browser.cjs /tmp/v864-browser/future-live
          npm run test:engulf-range-browser
          npm run test:elliott-browser -- /tmp/v864-browser/elliott
          node scripts/tests/wave-postclose-browser.cjs /tmp/v864-browser/postclose
          node scripts/tests/market-date-browser.cjs /tmp/v864-browser/market-date
      - name: Verify the published current entry point and report modules
        run: |
          node - <<'NODE'
          const Release=require('./version-v50.js'),assert=require('node:assert/strict'),F=require('./research-v83/forecast-engine.js'),M=require('./research-v83/market-engine.js'),S=require('./research-v83/market-freshness.js');
          (async()=>{
            const base='https://isu9922004a.github.io/VIP-6-SEARCH-Delay/';let error;
            for(let i=0;i<8;i++)try{
              const read=async p=>{const r=await fetch(base+p+'?v864='+Date.now());assert.equal(r.status,200,p);return r.text();};
              const [html,version,observations,fifth,report,market,marketJS,history,model,comfort,suite,share,refresh]=await Promise.all(['index.html','version-v50.js','research-v83/report-observations.js','research-v83/stock-fifth-module.js','research-v83/stock-simple-report.js','market-outlook.html','research-v83/market.js','data/index/TAIEX.json','data/kronos/TAIEX.json','market-report-comfort-v864.js','r45-report-suite.js','mobile-image-share-v1.js','market-report-refresh-v864.js'].map(read));
              assert.match(html,/engulf-range-report-v1.js/);assert.match(version,/ENGULF_RANGE_RESEARCH_1/);
              const shared=await read('structure-context-v1.js'),panel=await read('engulf-range-report-v1.js');assert.match(shared,/function confirmationResearch/);assert.match(panel,/K線吞沒與箱體突破確認/);
              assert.ok(version.includes("DISPLAY='"+Release.displayCode+"'"));assert.ok(report.includes("VERSION='"+Release.displayCode+"'"));assert.match(observations,/REPORT_OBSERVATIONS_8_6_4/);assert.match(fifth,/漲跌力道：/);assert.match(fifth,/關卡有沒有站穩：/);assert.match(market,/market-observations/);assert.match(marketJS,/ShitouReportObservations.fromMarket/);assert.ok(html.indexOf('report-observations.js?')<html.indexOf('stock-fifth-module.js?'));assert.match(html,/report-observations.js\?v=V8\.7\.2/);
              assert.ok(html.includes('market-report-comfort-v864.js?v='+Release.cacheVersion));assert.match(comfort,/MARKET_COMFORT_LAYOUT_V864/);assert.match(comfort,/MARKET_ONEPAGE_DYNAMIC_V864/);assert.match(refresh,/INTERVAL=300000/);assert.ok(html.includes('market-report-refresh-v864.js?v='+Release.cacheVersion));assert.match(comfort,/marketMobileReader/);assert.match(suite,/mountReader/);assert.match(share,/shareAsSingleImage/);assert.match(html,/mobile-image-share-v1.js\?v=V8\.7\.2-MARKETPAGE1/);assert.match(suite,/window.ShitouMarketComfortReport.render\(report,options\)/);
              const h=JSON.parse(history),f=JSON.parse(model),a=M.analyze(h);assert.equal(S.historyStatus(h).stale,false);assert.equal(F.evaluate(a.input,f).state,'MODEL_SAMPLE');assert.equal(F.executionVerified(f),true);assert.equal(f.asOf,h.closeDate);assert.ok(h.closeDate>=require('./data/index/TAIEX.json').closeDate);
              console.log(JSON.stringify({live:true,version:Release.displayCode,indexDate:h.closeDate,close:h.close,modelDate:f.asOf,target:f.targetDates[0],stockAndMarket:true,momentumAndPriceConfirmation:true,scriptOrderVerified:true,readableMarketABC:true,iphoneMobileReader:true,singleCompleteMarketImage:true,approvedOnePage:true,refreshBeforeExport:true}));return;
            }catch(e){error=e;if(i<7)await new Promise(r=>setTimeout(r,15000));}throw error;
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE


