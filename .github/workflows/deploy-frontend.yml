name: Deploy verified frontend release
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'market-outlook.html'
      - 'version-v50.js'
      - 'mario-theme-v930.*'
      - 'macd-plus-*.js'
      - 'strategy-extensions-v1.*'
      - 'main-force-lifeline-*.js'
      - 'strategy-low-base-*-v929.js'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - name: Verify original features, new strategies, release identity and script dependencies
        run: node scripts/validate-v930.cjs
  deploy:
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-data-pages.yml
    with: {artifact-name: v930-verified-frontend}
