name: Deploy verified frontend release
on:
  push:
    branches: ['main']
    paths:
      - 'version-v50.js'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify model matching, plain reports and market regression
        run: |
          node --check four-models-research-v1.js
          node --check research-v83/kronos-data.js
          node --check research-v83/market-simple-report.js
          node --check research-v83/stock-simple-report.js
          node --test scripts/tests/kronos-report-binding.test.cjs scripts/tests/research-plain-narrative.test.cjs scripts/tests/market-v86.test.cjs scripts/tests/index-update-v862.test.cjs scripts/tests/market-freshness-v862.test.cjs scripts/tests/market-simple-report.test.cjs scripts/tests/pages-runtime-data.test.cjs scripts/tests/structure-strength-v863.test.cjs scripts/tests/stock-simple-report.test.cjs
      - run: npm install --no-save --ignore-scripts playwright-core
      - name: Verify V8.6.3 structure, mobile layout and complete PNG variants
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/tests/structure-v863-browser.cjs /tmp/v863-browser
      - name: Check structure observations across the published stock universe
        run: node scripts/audit-structure-strength.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v863-browser-evidence
          path: /tmp/v863-browser
  deploy:
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-data-pages.yml
    with:
      artifact-name: frontend-release-pages

  live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the published V8.6.3 entry point and new report module
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          (async()=>{
            const base='https://isu9922004a.github.io/VIP-6-SEARCH-Delay/';let error;
            for(let i=0;i<8;i++)try{
              const read=async p=>{const r=await fetch(base+p+'?v863='+Date.now());assert.equal(r.status,200,p);return r.text();};
              const [html,version,structure,fifth,report]=await Promise.all(['index.html','version-v50.js','research-v83/structure-strength.js','research-v83/stock-fifth-module.js','research-v83/stock-simple-report.js'].map(read));
              assert.match(version,/DISPLAY='V8\.6\.3'/);assert.match(report,/VERSION='V8\.6\.3'/);assert.match(structure,/STRUCTURE_STRENGTH_8_6_3/);assert.match(fifth,/價格結構：/);assert.match(fifth,/結構劇本：/);assert.ok(html.indexOf('structure-strength.js?')<html.indexOf('stock-fifth-module.js?'));assert.match(html,/structure-strength.js\?v=V8\.6\.3/);
              console.log(JSON.stringify({live:true,version:'V8.6.3',structureModule:true,reportSections:[1,3,5],scriptOrderVerified:true}));return;
            }catch(e){error=e;if(i<7)await new Promise(r=>setTimeout(r,15000));}throw error;
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
