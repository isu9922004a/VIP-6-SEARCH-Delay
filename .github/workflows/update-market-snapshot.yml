name: Update TWSE TPEx market snapshot
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/update-market-snapshot.yml'
      - 'scripts/update-market-snapshot.mjs'
      - 'scripts/update-research-calendar.mjs'
      - 'scripts/update-scan-exclusions.mjs'
      - 'config/verified-market-closures.json'
      - 'scripts/verify-market-snapshot.mjs'
      - 'scripts/tests/update-market-snapshot.test.mjs'
  schedule:
    # UTC. Retry through Taipei next morning if the post-close scheduler is delayed.
    # Scheduled Actions are best-effort; workflow_dispatch and push also recover a missed run.
    - cron: '7,27,47 9-23 * * 1-5'
    - cron: '27 23 * * 0-4'
permissions:
  contents: write
concurrency:
  group: market-data-update
  cancel-in-progress: false
jobs:
  update-market-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test exchange calendar and snapshot guards
        run: node --test scripts/tests/update-market-snapshot.test.mjs
      - name: Fetch verified latest completed snapshot
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Verified snapshot attempt $attempt/3"
            if node scripts/update-market-snapshot.mjs && node scripts/verify-market-snapshot.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 45)); fi
          done
          echo "::error::Official same-date market data unavailable. Old snapshot retained; scans must wait."
          exit 1
      - name: Record freshness audit
        if: always()
        shell: bash
        run: |
          node scripts/verify-market-snapshot.mjs >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
      - name: Publish official completed-session calendar for research
        continue-on-error: true
        run: node scripts/update-research-calendar.mjs
      - name: Commit verified market data
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- data/market)" ]; then
            echo 'Verified snapshot unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/market
          TRADE_DATE=$(node -e "process.stdout.write(String(require('./data/market/latest.json').tradeDate))")
          git commit -m "data: verified complete market snapshot ${TRADE_DATE}"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            node scripts/verify-market-snapshot.mjs
            if git push origin HEAD:main; then exit 0; fi
          done
          echo '::error::Verified data could not be published; do not report success.'
          exit 1
