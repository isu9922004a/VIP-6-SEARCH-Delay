name: V9.7 newborn K0 acceptance
on:
  pull_request:
    branches: [main]
    paths: ['main-force-*', 'lifeline-liquidity-v97.json', 'kline-life-03-pages-v94.js', 'index.html', 'version-v50.js', 'scripts/*main-force*', 'scripts/tests/main-force-*', 'scripts/update-lifeline-liquidity-v97.cjs', '.github/workflows/v97-main-force.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  main-force:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: {CHROME_BIN: /usr/bin/google-chrome}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci
      - run: npm test
      - run: npm run test:contract
      - run: npm run research:validate
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Verify every stock and replay 120 sessions without future membership
        run: node scripts/audit-main-force-v97.cjs /tmp/v97-audit
      - name: Actual scan, stop, research, measured PNG pages, download, ZIP and share fallbacks
        run: node scripts/tests/main-force-v97-browser.cjs /tmp/v97-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v97-k0-acceptance
          path: |
            /tmp/v97-audit
            /tmp/v97-browser
