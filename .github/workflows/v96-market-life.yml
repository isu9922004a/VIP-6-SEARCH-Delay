name: V9.6 market life-line acceptance
on:
  pull_request:
    branches: [main]
    paths: ['market-life-*', 'kline-life-03-*', 'index.html', 'market-outlook.html', 'version-v50.js', 'scripts/tests/market-life-v96*', '.github/workflows/v96-market-life.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  market-life:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci
      - run: npm test
      - run: npm run test:contract
      - run: npm run research:validate
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Real index pages, mobile download/share/ZIP, source failure recovery and byte-identical stock PNGs
        run: node scripts/tests/market-life-v96-browser.cjs /tmp/v96-market-life
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v96-market-life-evidence
          path: /tmp/v96-market-life
