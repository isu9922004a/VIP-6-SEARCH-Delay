name: V9.22 TPEx frontend fallback focused acceptance
on:
  push:
    branches: ['fix/v922-tpex-redirect-guard']
    paths:
      - 'high-volatility-ui-v922.js'
      - 'scripts/tests/high-volatility-v922-browser.cjs'
      - '.github/workflows/v922-frontend-fallback-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          node --check high-volatility-ui-v922.js
          node --check scripts/tests/high-volatility-v922-browser.cjs
      - name: Install browser and Chinese font dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          npm install --prefix /tmp/v922-frontend --no-package-lock --no-save playwright-core@1.56.1
      - name: Verify TPEx failure recovery, SHA rejection, five other tabs and iPhone reports
        env:
          PLAYWRIGHT_MODULE: /tmp/v922-frontend/node_modules/playwright-core
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/tests/high-volatility-v922-browser.cjs /tmp/v922-frontend-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v922-frontend-fallback-evidence
          path: /tmp/v922-frontend-evidence/
          if-no-files-found: warn
          retention-days: 5
