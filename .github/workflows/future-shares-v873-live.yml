name: Verify published V8.7.3
on:
  push:
    branches: ['feat/future-shares-v873']
    paths: ['.github/workflows/future-shares-v873-live.yml']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Verify every published frontend module
        env:
          RESEARCH_BROWSER_ORIGIN: https://isu9922004a.github.io/VIP-6-SEARCH-Delay/
        run: python3 scripts/verify-deployed-frontend.py
      - name: Real stock and index buttons, current model or correct expiry blocking
        env:
          CHROME_BIN: /usr/bin/google-chrome
          RESEARCH_BROWSER_ORIGIN: https://isu9922004a.github.io/VIP-6-SEARCH-Delay/
        run: node scripts/tests/kronos-future-live-browser.cjs /tmp/v873-live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v873-live-proof
          path: |
            /tmp/v873-live
            /tmp/deployed-frontend-verification.json
