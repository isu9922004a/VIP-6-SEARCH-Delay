name: V9.29 official fundamental source probe
on:
  pull_request:
    paths:
      - 'strategy-low-base-fundamentals-v929.js'
      - 'scripts/collect-v929-fundamentals.mjs'
      - '.github/workflows/v929-fundamentals-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/tests/low-base-fundamentals-v929.test.cjs
      - run: node scripts/collect-v929-fundamentals.mjs /tmp/v929-fundamentals
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v929-fundamentals-official-receipts
          path: /tmp/v929-fundamentals/
          if-no-files-found: warn
          retention-days: 90
