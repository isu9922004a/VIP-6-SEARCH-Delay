name: V9.16 one-time canonical index version alignment
on:
  pull_request:
    branches: [main]
    paths:
      - 'version-v50.js'
      - '.github/workflows/v916-index-sync.yml'
permissions:
  contents: write
jobs:
  align-index:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/v916-risk-transparency'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v916-risk-transparency
          persist-credentials: true
      - name: Rewrite only the old version identities in the large canonical HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          source=p.read_text(encoding='utf-8')
          before='<title>石頭少爺 V9.15'
          if before not in source and '<title>石頭少爺 V9.16' not in source:
              raise SystemExit('Unsafe index format: title not found')
          result=source.replace('V9.15', 'V9.16')
          if '<title>石頭少爺 V9.16' not in result:
              raise SystemExit('V9.16 title not established')
          for name in ('market-report-comfort-v864.js','market-report-refresh-v864.js'):
              expected='./'+name+'?v=V9.16-MARKETLIFE-1'
              if result.count(expected)!=1:
                  raise SystemExit(name+' canonical cache identity did not match exactly once')
          if 'version-v50.js?v=V9.16' not in result:
              raise SystemExit('Missing V9.16 release script tag')
          if result != source:
              p.write_text(result,encoding='utf-8')
              print('Updated index title and script cache tags: ',source.count('V9.15'),' occurrences')
          else:
              print('Canonical index already matches V9.16')
          PY
      - name: Commit canonical release HTML to this exact feature branch only
        run: |
          git diff -- index.html
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore(v9.16): align canonical index release and script cache tags'
          git push origin HEAD:refs/heads/feat/v916-risk-transparency
