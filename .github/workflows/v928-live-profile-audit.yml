name: V9.28 live data profile audit
on:
  push:
    branches: ['feat/v928-telegram-bot']
    paths: ['scripts/audit-v928-live-profiles.mjs', '.github/workflows/v928-live-profile-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Probe real Pages and Worker inputs (two stocks, four profiles; no publish)
        run: node scripts/audit-v928-live-profiles.mjs "$RUNNER_TEMP/v928-profile-evidence.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v928-live-profile-evidence
          path: ${{ runner.temp }}/v928-profile-evidence.json
