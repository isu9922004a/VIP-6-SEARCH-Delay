name: Worker and research data contracts
on:
  pull_request:
  push:
    branches: ['main', 'codex/**']
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check standalone Worker syntax
        run: |
          node --check stock-worker.mjs
          node --check market-worker.mjs
      - name: Verify embedded contract is reproducible
        run: |
          node scripts/build-worker-contract.cjs
          git diff --exit-code -- stock-worker.mjs market-worker.mjs
      - name: Run all offline regression tests
        run: node scripts/run-all-tests.cjs
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Recompute every current stock and validate both stop directions
        run: node scripts/audit-official-research-v829.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: full-universe-research-V8.2.9
          path: evidence/research-v829-all-stocks.*
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        fallback: ['0', '1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chinese display fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Install browser test driver
        run: npm install --prefix /tmp/research-browser --no-package-lock --no-save playwright-core@1.56.1
      - name: Compare all report fields and mobile image bounds
        env:
          PLAYWRIGHT_MODULE: /tmp/research-browser/node_modules/playwright-core
          CHROME_BIN: /usr/bin/google-chrome
          RESEARCH_FALLBACK: ${{ matrix.fallback }}
        run: node scripts/tests/research-context-r16-browser.cjs /tmp/research-evidence
      - name: Verify official history and novice long/short plan on mobile
        if: matrix.fallback == '0'
        env:
          PLAYWRIGHT_MODULE: /tmp/research-browser/node_modules/playwright-core
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/tests/research-official-v829-browser.cjs /tmp/research-evidence/official
      - name: Exercise stock query responsiveness and recovery
        if: matrix.fallback == '0'
        env:
          PLAYWRIGHT_MODULE: /tmp/research-browser/node_modules/playwright-core
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/tests/stock-query-v826-browser.cjs /tmp/research-evidence/query
      - name: Verify V8.3 real Kronos report and independent index
        if: matrix.fallback == '0'
        env:
          PLAYWRIGHT_MODULE: /tmp/research-browser/node_modules/playwright-core
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/tests/kronos-v83-browser.cjs /tmp/research-evidence/kronos
      - name: Capture generated chart for review
        if: matrix.fallback == '0'
        run: node -e 'console.log("CHART_REVIEW_PNG="+require("node:fs").readFileSync("/tmp/research-evidence/8039-chart.png").toString("base64"))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-report-${{ matrix.fallback }}
          path: /tmp/research-evidence
  deployed-frontend:
    if: github.ref == 'refs/heads/main'
    needs: [contracts, browser, universe]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RESEARCH_BROWSER_ORIGIN: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Pages serves this release
        run: python3 scripts/verify-deployed-frontend.py
      - name: Install Chinese display fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Install browser test driver
        run: npm install --prefix /tmp/research-browser --no-package-lock --no-save playwright-core@1.56.1
      - name: Exercise deployed frontend with recorded completed-day data
        env:
          PLAYWRIGHT_MODULE: /tmp/research-browser/node_modules/playwright-core
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/tests/research-context-r16-browser.cjs /tmp/deployed-research-evidence
      - name: Verify deployed query responsiveness
        env:
          PLAYWRIGHT_MODULE: /tmp/research-browser/node_modules/playwright-core
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/tests/stock-query-v826-browser.cjs /tmp/deployed-research-evidence/query
      - name: Verify V8.4 live stock and market PNG downloads
        env:
          PLAYWRIGHT_MODULE: /tmp/research-browser/node_modules/playwright-core
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/tests/v84-live-smoke.cjs
      - name: Verify live official price, calendar and long/short plan for 7704 and 8039
        env:
          PLAYWRIGHT_MODULE: /tmp/research-browser/node_modules/playwright-core
          CHROME_BIN: /usr/bin/google-chrome
        run: RESEARCH_LIVE=1 node scripts/tests/research-official-v829-browser.cjs /tmp/deployed-research-evidence/official
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployed-frontend-evidence
          path: |
            /tmp/deployed-research-evidence
            /tmp/deployed-frontend-verification.json
            /tmp/deployed-research-evidence/official
            evidence/v84-live

