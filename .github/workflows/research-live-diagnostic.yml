name: Research live source diagnostic
on:
  push:
    branches: ['codex/v8.2.7']
    paths: ['scripts/diagnose-research-live.cjs', '.github/workflows/research-live-diagnostic.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read current price evidence
        run: node scripts/diagnose-research-live.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: research-live-source
          path: /tmp/research-live.json
