name: All-stock beginner wave report clarity
on:
  pull_request:
    paths: ['scripts/tests/wave-reading-evidence.test.cjs', 'elliott-wave-stock-beginner-v1.js', 'elliott-wave-report-v1.js', 'elliott-wave-visual-v1.js', 'scripts/tests/stock-wave-clear-browser.cjs', 'scripts/tests/stock-wave-beginner.test.cjs', '.github/workflows/stock-wave-clear.yml']
permissions:
  contents: read
jobs:
  report-clarity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Preserve original stock report renderers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p /tmp/stock-wave-clear-before
          for wave_file in elliott-wave-stock-beginner-v1.js elliott-wave-report-v1.js elliott-wave-visual-v1.js; do git show "$BASE_SHA:$wave_file" > "/tmp/stock-wave-clear-before/$wave_file"; done
      - name: Install Traditional Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Compare actual reports for the eleven user examples and unchanged image modes
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/tests/stock-wave-clear-browser.cjs /tmp/stock-wave-clear
      - name: Check existing image, download and sharing behaviour
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node scripts/tests/elliott-browser.cjs /tmp/stock-wave-clear/elliott
          node scripts/tests/v84-report-browser.cjs /tmp/stock-wave-clear/exports
      - name: Unit, contract and research safety checks
        run: |
          npm test
          npm run test:contract
          npm run research:validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stock-wave-clear-before-after
          path: /tmp/stock-wave-clear
