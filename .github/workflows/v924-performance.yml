name: V9.24 performance candidate and protected contract
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  performance:
    if: startsWith(github.head_ref, 'feat/v924-perf-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Rebuild and check the embedded contract
        run: |
          npm run build:worker-contract
          git diff --exit-code -- stock-worker.mjs market-worker.mjs worker-data-contract-v1.js
          node --check stock-worker.mjs
          node --check market-worker.mjs
      - name: Audit references and build isolated frontend candidate
        run: |
          node scripts/audit-frontend-deps-v924.cjs "$RUNNER_TEMP/v924-audit.json"
          node scripts/build-frontend-v924.cjs "$RUNNER_TEMP/v924-frontend" --defer-future
          for js in "$RUNNER_TEMP"/v924-frontend/*.js; do node --check "$js"; done
      - run: npm run test:contract
      - run: npm test
      - run: npm run research:validate
      - name: Install Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Browser checks on canonical frontend
        run: npm run test:worker-browser -- "$RUNNER_TEMP/v924-worker-source"
      - name: Exercise modularized runtime candidate (no deployment)
        run: |
          cp "$RUNNER_TEMP"/v924-frontend/index.html .
          cp "$RUNNER_TEMP"/v924-frontend/index-inline-v924-* .
          npm run test:worker-browser -- "$RUNNER_TEMP/v924-worker-split"
          npm run test:ui:v95 -- "$RUNNER_TEMP/v924-ui-split"
          npm run test:browser -- "$RUNNER_TEMP/v924-research-split"
          node scripts/tests/enhanced-macd-v923-browser.cjs "$RUNNER_TEMP/v924-macd-split"
          node scripts/tests/kronos-future-browser.cjs "$RUNNER_TEMP/v924-future-split"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v924-performance-evidence
          path: |
            ${{ runner.temp }}/v924-audit.json
            ${{ runner.temp }}/v924-frontend
            ${{ runner.temp }}/v924-worker-source
            ${{ runner.temp }}/v924-worker-split
            ${{ runner.temp }}/v924-ui-split
            ${{ runner.temp }}/v924-research-split
            ${{ runner.temp }}/v924-macd-split
            ${{ runner.temp }}/v924-future-split
