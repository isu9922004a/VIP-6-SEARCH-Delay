name: V9.22 collect verified TPEx high-volatility source snapshot
on:
  workflow_dispatch:
  push:
    branches:
      - 'fix/v922-tpex-redirect-guard'
    paths:
      - 'scripts/collect-tpex-v922.mjs'
      - '.github/workflows/v922-collect-tpex.yml'
      - 'scripts/tests/v922-tpex-collector.test.mjs'
      - 'scripts/tests/high-volatility-worker-v922.test.mjs'
      - 'scripts/tests/high-volatility-v922.test.cjs'
      - 'scripts/fixtures/high-volatility-v922.cjs'
      - 'scripts/verify-tpex-v922.mjs'
      - 'high-volatility-v922.js'
      - 'high-volatility-ui-v922.js'
      - 'market-worker.mjs'
  schedule:
    # Taipei 16:40, 17:40, 19:40, 21:40 on weekdays; market calendar is decisive.
    - cron: '40 8,9,11,13 * * 1-5'
permissions:
  contents: write
  actions: write
concurrency:
  group: v922-official-tpex-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate V9.22 Worker syntax and isolated live-route behavior
        run: |
          node --check market-worker.mjs
          node --check high-volatility-v922.js
          node --check high-volatility-ui-v922.js
          node --test scripts/tests/high-volatility-worker-v922.test.mjs scripts/tests/high-volatility-v922.test.cjs
      - name: Verify producer input guards
        run: node --test scripts/tests/v922-tpex-collector.test.mjs
      - name: Fetch three dated official TPEx sources and build integrity manifest
        run: node scripts/collect-tpex-v922.mjs
      - name: Require digest, session, coverage, units and source provenance
        run: node scripts/verify-tpex-v922.mjs
      - name: Preserve verified receipt independently of publishing
        uses: actions/upload-artifact@v4
        with:
          name: v922-tpex-snapshot-${{ github.run_id }}
          path: data/high-volatility/tpex/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve verified TPEx receipt on repair branch for review only
        if: github.ref == 'refs/heads/fix/v922-tpex-redirect-guard'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-tpex-v922.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/high-volatility/tpex/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test(v9.22): preserve verified official TPEx session receipt for review'
          git push origin HEAD:"${GITHUB_REF_NAME}"
      - name: Commit only the complete date-bound official snapshot on main
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/high-volatility/tpex/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data(v9.22): verified TPEx daily source receipt'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            node scripts/verify-tpex-v922.mjs
            if git push origin HEAD:main; then
              # Pushes authenticated with GITHUB_TOKEN cannot start push workflows.
              # Explicit workflow_dispatch is required to publish daily GitHub Pages data.
              gh workflow run deploy-frontend.yml --ref main
              exit 0
            fi
          done
          exit 1
