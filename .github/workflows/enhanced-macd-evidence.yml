name: Collect Enhanced MACD official evidence
on:
  workflow_dispatch:
  schedule:
    # Taipei 21:20 and 22:20. Collection requires a current verified
    # market snapshot and preserves diagnostics if official data is incomplete.
    - cron: '20 13,14 * * 1-5'
permissions:
  contents: write
concurrency:
  group: enhanced-macd-evidence-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Save current scan and point-in-time company inputs
        run: node scripts/collect-enhanced-macd-v923.mjs /tmp/enhanced-macd/latest.json /tmp/enhanced-macd/archive.json
      - name: Publish only complete, same-day verified MACD scan
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("/tmp/enhanced-macd/latest.json","utf8"));if(x.result?.complete!==true||x.result.errors?.length||x.result.incomplete?.length||x.result.date!==x.date||!x.snapshotHash)process.exit(1)'
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "Main moved during scan; refuse stale publication"; exit 1; }
          cp /tmp/enhanced-macd/latest.json data/enhanced-macd/latest.json
          git add data/enhanced-macd/latest.json
          if git diff --cached --quiet; then
            echo "Verified scan unchanged"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "data(v9.23): publish complete official MACD scan"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: enhanced-macd-evidence
          path: /tmp/enhanced-macd/*.json
          if-no-files-found: warn
          retention-days: 90
