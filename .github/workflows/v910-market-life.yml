name: V9.10 dedicated TAIEX life-line risk and dual-page acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'market-life-*.js'
      - 'market-life-v96.css'
      - 'index.html'
      - 'market-outlook.html'
      - 'version-v50.js'
      - 'scripts/tests/market-life-*.cjs'
      - '.github/workflows/v910-market-life.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  risk-and-poster:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHROME_BIN: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Verify TAIEX data, K0-K3, no future leakage and risk model
        run: |
          node --check market-life-risk-v910.js
          node --check market-life-outcome-v910.js
          node --check market-life-visual-v910.js
          node --test scripts/tests/market-life-risk-v910.test.cjs scripts/tests/market-life-visual-v910.test.cjs
      - run: npm test
      - run: npm run test:contract
      - run: npm run research:validate
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Render actual TAIEX dual-page PNG and exercise ZIP/download/share on two entry points
        run: node scripts/tests/market-life-v910-browser.cjs /tmp/v910-market-life
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v910-market-life-evidence
          path: /tmp/v910-market-life
