name: Post-close live stock and index wave image acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/tests/postclose-live-browser.cjs'
      - '.github/workflows/postclose-live-acceptance.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  live-image:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CHROME_BIN: /usr/bin/google-chrome
      RESEARCH_BROWSER_ORIGIN: https://isu9922004a.github.io/VIP-6-SEARCH-Delay/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Exercise visible stock/market report actions, source date, real PNG and share
        run: node scripts/tests/postclose-live-browser.cjs /tmp/postclose-live-wave
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postclose-live-wave-png
          path: /tmp/postclose-live-wave
