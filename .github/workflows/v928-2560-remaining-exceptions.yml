name: V9.28 2560 remaining official data exceptions
on:
  push:
    branches: ['feat/v928-telegram-bot']
    paths: ['.github/workflows/v928-2560-remaining-exceptions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reconcile exact exception reasons against official archived source and original 2560 rules
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/v928-exceptions"
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'),assert=require('node:assert/strict');
          const root=process.cwd(),H=require('./research-official-history-v1.js'),D=require('./selection-data-v2.js'),C=require('./strategy-2560-v1.js'),W=require('./worker-data-contract-v1.js');
          const manifest=JSON.parse(fs.readFileSync('data/research/manifest.json')),snapshot=JSON.parse(fs.readFileSync('data/market/latest.json'));
          const sha=b=>crypto.createHash('sha256').update(b).digest('hex');
          const date=manifest.date,report={date,publicationAllowed:false,rows:[],errors:[]};
          const out=process.env.RUNNER_TEMP+'/v928-exceptions';
          const save=()=>fs.writeFileSync(out+'/report.json',JSON.stringify(report,null,2)+'\n');
          const priorErrors=['1324','1339','1423','1525','1730','1817','2432','2496','2596','2729','2740','2938','2939','2947','2948','3115','3168','3628','3652','4440','4581','5205','5215','5906','6195','6431','6474','6581','6606','6624','6641','6664','6671','6754','6762','6807','6884','6904','6921','6936','6952','6955','7631','7705','7747','7757','8421','8423','8442','8481','8482','9929'];
          const pinnedDate='2026-11-27';
          global.ShitouOfficialResearchHistory=H;
          global.fetch=async input=>{const u=new URL(String(input),'https://local.invalid');const marker='/data/research/';let file;if(u.pathname.endsWith('/research-calendar.json'))file='data/market/research-calendar.json';else if(u.pathname.includes(marker))file='data/research/'+u.pathname.split(marker)[1];else throw Error('UNEXPECTED_SOURCE '+u.pathname);const full=path.resolve(root,file);if(!full.startsWith(root+path.sep))throw Error('INVALID_PATH');try{return new Response(fs.readFileSync(full),{status:200});}catch{return new Response('',{status:404});}};
          (async()=>{
            assert.equal(snapshot.tradeDateIso,date);assert.equal(manifest.snapshotContentSha256,snapshot.contentSha256);assert.equal(date,pinnedDate,'Prior exception evidence is for 2026-11-27 only');
            const entries=Object.values(manifest.stocks),map=new Map(snapshot.rows.map(q=>[String(q.code),q]));
            D.bind({map,snapshotRows:map.size,meta:{total:map.size,targetTradeDate:date,completedTradeDate:date,expectedTradeDate:date,twseQuoteDate:date,tpexQuoteDate:date,marketCoverageReady:true,industryCoverageReady:true,snapshotTimelinessReady:true,snapshotContentSha256:snapshot.contentSha256}});
            await D.prepareResearchEvidence();
            let coverage=null;
            if(manifest.historyCoverage?.path==='history-coverage.json'){const bytes=fs.readFileSync('data/research/history-coverage.json');assert.equal(sha(bytes),manifest.historyCoverage.sha256);coverage=JSON.parse(bytes);assert.equal(coverage.date,date);}
            const codes=[...new Set([...priorErrors,...entries.filter(x=>x.ready!==true).map(x=>x.code)])].sort();
            const classify=(reason,raw,scope,record)=>{
              if(scope?.formalVolumeEligible===false)return 'VOLUME_SCOPE_CONFLICT';
              if(/指紋|契約|代號|市場別|交易日期|OHLC|不一致|未對齊/.test(reason))return 'SOURCE_CONTRACT_OR_ALIGNMENT';
              if(raw?.dailySeries?.length<C.RULE.minBars)return 'INSUFFICIENT_CONTIGUOUS_HISTORY';
              if(record?.classification==='DR_RULES')return 'DR_RULES';
              if(/價格基準|還原|除權|除息|交易日曆/.test(reason))return 'PRICE_BASIS_OR_CALENDAR';
              return 'OTHER_REVIEW_REQUIRED';
            };
            for(const code of codes){
              const entry=manifest.stocks[code],q=map.get(code),row={code,priorDataError:priorErrors.includes(code),archiveReady:entry?.ready===true,manifestBars:entry?.bars,manifestReason:entry?.reason};report.rows.push(row);
              try{
                assert.ok(entry&&q);const bytes=fs.readFileSync(path.join('data/research',entry.path));assert.equal(sha(bytes),entry.sha256);
                const raw=JSON.parse(bytes),scope=W.auditQuote(q).volumeScopeAudit,cov=coverage?.stocks?.[code];
                if(cov)assert.equal(cov.reportSha256,entry.sha256);
                row.coverage=cov?{classification:cov.classification,listing:cov.listing,latestGap:cov.latestGap}:null;
                row.originalBars=raw.originalDailySeries?.length;row.lastGap=raw.officialArchiveEvidence?.excludedEarlierSessions?.at(-1)??null;row.officialLast=raw.dailySeries?.at(-1);row.snapshot={open:q.open,high:q.high,low:q.low,close:q.close,volume:q.volume,officialTradeValue:q.officialTradeValue,volumeScopeAudit:scope};
                const p=await D.acquireDailyBatch([{code,q}],async()=>{throw Error('OFFLINE_OFFICIAL_ARCHIVE_AUDIT_NO_FALLBACK');},{captureResearch:false}),hit=p.results[0];
                if(!hit?.ok){row.status='ACQUISITION_REJECTED';row.reason=hit?.error??'Missing receipt';row.failureCode=hit?.failureCode;row.category=classify(row.reason,raw,scope,cov);}
                else{
                  const result=C.evaluate(hit.data,{asOf:date,code,quote:q,sector:q});row.status=result.status;row.reason=(result.reasons||[]).join('；');row.category=['PASS','FAIL','EXCLUDED'].includes(result.status)?'EVALUATED':classify(row.reason,raw,scope,cov);row.source=hit.acquisitionSource;row.candidate=result.eligible===true;
                }
              }catch(e){row.status='AUDIT_ERROR';row.reason=String(e.message);row.category='AUDIT_ERROR';report.errors.push({code,reason:row.reason});}
              finally{H.release(code,date);}
            }
            const counts=list=>list.reduce((a,x)=>(a[x.category]=(a[x.category]||0)+1,a),{});
            report.summary={checked:report.rows.length,prior52:counts(report.rows.filter(x=>x.priorDataError)),allReviewed:counts(report.rows),errors:report.errors.length};
            save();console.log('V928_REMAINING_EXCEPTION_SUMMARY '+JSON.stringify(report.summary));
            for(const r of report.rows.filter(x=>x.priorDataError))console.log('V928_REMAINING_EXCEPTION '+JSON.stringify(r));
            assert.equal(report.rows.filter(x=>x.priorDataError).length,52);assert.equal(new Set(report.rows.map(x=>x.code)).size,report.rows.length);assert.equal(report.errors.length,0);
          })().catch(e=>{report.errors.push({error:String(e.message)});save();console.error(e);process.exitCode=1;});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v928-remaining-2560-exceptions-not-for-publication
          path: ${{ runner.temp }}/v928-exceptions
