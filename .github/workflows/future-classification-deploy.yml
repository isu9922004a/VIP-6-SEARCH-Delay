name: Validate and deploy future report classification explanations
on:
  workflow_dispatch:
  push:
    branches: ['main', 'feat/future-classification-v873']
    paths: ['kronos-future-report-v1.js', 'scripts/tests/kronos-future-classification-browser.cjs', '.github/workflows/future-classification-deploy.yml']
concurrency:
  group: future-classification-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run test:contract
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Install CJK fonts with bounded network retries
        timeout-minutes: 3
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y fonts-noto-cjk
      - name: Freeze the previous deployed renderer
        run: git show 14c494308588956e4285848c01dc8ec2a6632974:kronos-future-report-v1.js > /tmp/future-classification-baseline.js
      - name: Every current instrument, unchanged chart and numbers, both actual PNG files
        env:
          CHROME_BIN: /usr/bin/google-chrome
          CLASSIFICATION_BASELINE: /tmp/future-classification-baseline.js
          CLASSIFICATION_SHARD: ${{ matrix.shard }}
          CLASSIFICATION_SHARDS: '4'
        run: node scripts/tests/kronos-future-classification-browser.cjs /tmp/future-classification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: future-classification-${{ matrix.shard }}
          path: |
            /tmp/future-classification/audit-*.json
            /tmp/future-classification/review
  deploy:
    needs: [unit, reports]
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-data-pages.yml
    with:
      artifact-name: future-classification-pages
  live:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Install CJK fonts with bounded network retries
        timeout-minutes: 3
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y fonts-noto-cjk
      - name: Verify deployed assets and current stock/index normal and watermarked downloads
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          python scripts/verify-deployed-frontend.py
          node scripts/tests/kronos-future-live-browser.cjs /tmp/future-classification-live
          node scripts/tests/market-actions-top-live-browser.cjs /tmp/future-classification-market
          node - <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync('/tmp/future-classification-live/results.json'));
          if(!r.source?.fresh||r.images?.length!==4)throw Error('Current model images did not complete');
          const assert=require('node:assert/strict');
          for(const report of r.images){
            const a=report.audit;
            assert.equal(a.version,'KRONOS_FUTURE_REPORT_V88_1');
            assert.equal(a.shares.state,'READY');
            const n=v=>a.kind==='market'?v.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):v.toFixed(2);
            const lo=n(a.shares.band.lower),hi=n(a.shares.band.upper),unit=a.shares.instrument.unit;
            for(const line of ['三排都比較指定日收盤，範圍 '+lo+'～'+hi+' '+unit,'模擬收盤高於'+hi+unit+'，列為「偏多」。','收盤在'+lo+'～'+hi+unit+'（含邊界），列為「盤整」。','模擬收盤低於'+lo+unit+'，列為「偏空」。','下個交易日收盤：'+a.shares.rows[0].denominator+'種模擬中，有'+a.shares.rows[0].counts[1]+'種在範圍內；三排共用此範圍。'])assert.ok(a.logicalTexts.includes(line),'Missing deployed classification explanation: '+line);
            for(const row of a.shares.rows){
              assert.equal(row.counts.reduce((x,y)=>x+y,0),row.denominator);
              assert.equal(row.displayUnits.reduce((x,y)=>x+y,0),1000);
            }
            assert.equal(a.noClipping,true);
            assert.equal(a.noTextOverlap,true);
            assert.equal(a.noCardOverflow,true);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: future-classification-live
          path: |
            /tmp/future-classification-live
            /tmp/future-classification-market
