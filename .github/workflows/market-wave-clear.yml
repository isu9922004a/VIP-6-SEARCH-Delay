name: Market beginner wave report clarity
on:
  pull_request:
    paths: ['scripts/tests/wave-reading-evidence.test.cjs', 'research-integration-v1.js', 'scripts/tests/research-context-r16-browser.cjs', 'elliott-wave-market-beginner-v1.js', 'elliott-wave-stock-beginner-v1.js', 'elliott-wave-report-v1.js', 'elliott-wave-visual-v1.js', 'scripts/tests/market-wave-beginner.test.cjs', 'scripts/tests/market-wave-clear-browser.cjs', '.github/workflows/market-wave-clear.yml']
permissions:
  contents: read
jobs:
  market-clarity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - name: Preserve deployed renderers for same-input comparisons
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p /tmp/market-wave-clear-before
          for wave_file in elliott-wave-market-beginner-v1.js elliott-wave-stock-beginner-v1.js elliott-wave-report-v1.js elliott-wave-visual-v1.js; do if git cat-file -e "$BASE_SHA:$wave_file" 2>/dev/null; then git show "$BASE_SHA:$wave_file" > "/tmp/market-wave-clear-before/$wave_file"; fi; done
      - name: Install Traditional Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Compare both market routes and preserve other report images
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/tests/market-wave-clear-browser.cjs /tmp/market-wave-clear
      - name: Check all original report buttons, watermarks and sharing
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node scripts/tests/elliott-browser.cjs /tmp/market-wave-clear/elliott
          node scripts/tests/v84-report-browser.cjs /tmp/market-wave-clear/exports
      - name: Unit, data contract and research safety checks
        run: |
          npm test
          npm run test:contract
          npm run research:validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-wave-clear-before-after
          path: /tmp/market-wave-clear
