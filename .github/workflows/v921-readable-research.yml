name: V9.3 beginner research and front-button regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'research-chart*'
      - 'kline-life-03-report-v1.js'
      - 'research-integration-v1.js'
      - 'research-ui-v921.css'
      - 'version-v50.js'
      - 'scripts/tests/research-v921*'
      - '.github/workflows/v921-readable-research.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry-and-rendering:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: npm ci
      - name: Install Chinese fonts for actual glyph measurements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Protected sources, exact event dates and model isolation
        run: |
          node --check research-chart-layout-v921.js
          node --check research-chart-v1.js
          node --check kline-life-03-report-v1.js
          node --check research-integration-v1.js
          node --test scripts/tests/research-v921.test.cjs scripts/tests/research-v93-plain.test.cjs
      - name: Actual Canvas geometry, long content and iPhone preview/export
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/tests/research-v921-browser.cjs /tmp/v921-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v921-readable-research-evidence
          path: /tmp/v921-browser
