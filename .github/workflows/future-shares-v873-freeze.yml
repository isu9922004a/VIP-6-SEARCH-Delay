name: Freeze V8.7.2 report baselines for V8.7.3
on:
  push:
    branches: ['feat/future-shares-v873']
    paths: ['.github/workflows/future-shares-v873-freeze.yml']
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Freeze every original report before template changes
        env:
          CHROME_BIN: /usr/bin/google-chrome
          SOURCE_REVISION: 6ebcc10adac65a4cb7a5a30f1ebe51ef0d98df17
        run: node scripts/freeze-future-v873.cjs /tmp/future-v873-frozen
      - uses: actions/upload-artifact@v4
        with:
          name: future-v873-frozen-baselines
          path: /tmp/future-v873-frozen
          retention-days: 30
