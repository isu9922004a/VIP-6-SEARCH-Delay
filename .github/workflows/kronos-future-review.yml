name: Future K report and model provenance checks
on:
  pull_request:
    paths: ['kronos/future*.py', 'kronos-future-*.js', 'scripts/kronos-future-automation.cjs', 'scripts/tests/kronos-future*', '.github/workflows/kronos-future*.yml', 'data/kronos-future/**']
permissions:
  contents: read
jobs:
  reports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Unit, contract and original research checks
        run: |
          npm test
          npm run test:contract
          npm run research:validate
      - name: Real phone reports, buttons, sharing and every published instrument
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          node scripts/tests/kronos-future-browser.cjs /tmp/future-review/buttons
          node scripts/tests/kronos-future-universe-browser.cjs /tmp/future-review/universe
          node scripts/tests/elliott-browser.cjs /tmp/future-review/wave-regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: future-review
          path: /tmp/future-review
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: kronos/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kronos-weights-${{ hashFiles('kronos/model-lock.json') }}
      - run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r kronos/requirements.txt
      - name: Compare cached decoding against original pinned model weights
        run: python scripts/tests/kronos-future-cache.py
