name: Deploy current verified data to Pages
on:
  workflow_call:
    inputs:
      artifact-name:
        type: string
        default: verified-pages
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: verified-data-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Full-market Pages synchronization can exceed ten minutes. Do not cancel a
    # healthy syncing_files deployment before its supported ten-minute action limit.
    # Forty minutes allows all three attempts plus packaging and 20/40s backoff.
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_final.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - name: Package the current site and data without development files
        run: |
          mkdir -p /tmp/verified-site
          tar --exclude=./.git --exclude=./.github --exclude=./evidence --exclude=./scripts --exclude=./third_party --exclude=./kronos --exclude=./node_modules -cf - . | tar -xf - -C /tmp/verified-site
          node scripts/prepare-pages-runtime-data.cjs /tmp/verified-site
          test -s /tmp/verified-site/data/kronos/manifest.json
          test -s /tmp/verified-site/data/index/TAIEX.json
          test ! -d /tmp/verified-site/kronos
      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ inputs.artifact-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/verified-site
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
        with:
          artifact_name: ${{ inputs.artifact-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 600000

      - name: Wait for a concurrent Pages deployment before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - uses: actions/deploy-pages@v4
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        with:
          artifact_name: ${{ inputs.artifact-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 600000
      - name: Allow a pending Pages deployment to finish
        if: steps.deployment_retry.outcome == 'failure'
        run: sleep 40
      - uses: actions/deploy-pages@v4
        id: deployment_final
        if: steps.deployment_retry.outcome == 'failure'
        with:
          artifact_name: ${{ inputs.artifact-name }}-${{ github.run_id }}-${{ github.run_attempt }}
          timeout: 600000
